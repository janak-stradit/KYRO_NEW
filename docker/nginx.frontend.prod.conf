# ============================================================
# KYRO Frontend — Nginx config for PRODUCTION (HTTPS via Let's Encrypt)
# Mounted over the image's default config by docker-compose.prod.yml.
# Local dev keeps using docker/nginx.frontend.conf (HTTP only, baked
# into the image) unchanged.
# ============================================================

server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge — must stay reachable on plain
    # HTTP for certificate issuance/renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/kyro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kyro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Proxy API requests to the backend API container
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
