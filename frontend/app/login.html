<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        window.APP_BASE = location.pathname.startsWith('/next') ? '/next' : '';
        document.write('<base href="' + window.APP_BASE + '/">');
    </script>
    <title>Sign in · KYRO AML</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body class="page-login">
    <main class="login">
        <section class="login__card" aria-labelledby="login-title">
            <img src="assets/logo.svg" alt="" width="40" height="40">
            <h1 id="login-title">Sign in to KYRO AML</h1>
            <form id="login-form" novalidate>
                <label class="field-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                <label class="field-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                <p class="form-error" id="login-error" role="alert" hidden></p>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
        </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="js/pages/login/login.js"></script>
</body>
</html>
